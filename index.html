/* =====================  ENVOI ROBUSTE : file d'attente visible + sauvegarde de l'enregistrement  ===================== */
const OB={live:{},waiters:[],resumed:false,recChecked:false,recAt:0};
function obDB(){return new Promise((res,rej)=>{
  try{const q=indexedDB.open('pepie-ob',1);q.onupgradeneeded=()=>q.result.createObjectStore('items',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}
})}
async function obPut(it){try{const db=await obDB();await new Promise(r=>{const t=db.transaction('items','readwrite');t.objectStore('items').put(it);t.oncomplete=r;t.onerror=r;t.onabort=r})}catch(e){}}
async function obGet(id){try{const db=await obDB();return await new Promise(r=>{const q=db.transaction('items').objectStore('items').get(id);q.onsuccess=()=>r(q.result||null);q.onerror=()=>r(null)})}catch(e){return null}}
async function obAll(){try{const db=await obDB();return await new Promise(r=>{const q=db.transaction('items').objectStore('items').getAll();q.onsuccess=()=>r(q.result||[]);q.onerror=()=>r([])})}catch(e){return []}}
async function obDel(id){try{const db=await obDB();await new Promise(r=>{const t=db.transaction('items','readwrite');t.objectStore('items').delete(id);t.oncomplete=r;t.onerror=r;t.onabort=r})}catch(e){}}
const obRecDel=()=>obDel('rec-current');
function obWake(){const w=OB.waiters.splice(0);w.forEach(f=>f())}
const obWait=ms=>new Promise(r=>{const t=setTimeout(()=>{r()},ms);OB.waiters.push(()=>{clearTimeout(t);r()})});
window.addEventListener('online',obWake);

/* envoi des fichiers : on réessaie tant que le réseau manque, sans jamais perdre l'audio ou la photo */
async function obUpload(it,onWait){
  OB.live[it.id]=1;
  try{
    for(let n=0;n<240;n++){
      let netFail=false;
      for(const f of it.files){
        if(f.done)continue;
        let r;
        try{r=await sb.storage.from(f.bucket).upload(f.path,f.blob,{contentType:f.mime})}catch(e){r={error:e}}
        if(r.error){
          if(/already exists|duplicate|409/i.test((r.error.message||'')+(r.error.statusCode||'')+(r.error.status||''))){f.done=true;continue}
          if(isNetErr(r.error)){netFail=true;break}
          await obDel(it.id);throw r.error;
        }
        f.done=true;
      }
      if(!netFail)return;
      if(onWait)onWait();
      await obWait(5000);
    }
    throw new Error('abandon');
  }finally{delete OB.live[it.id]}
}
const obMeta=m=>{const o={};META_KEYS.forEach(k=>{if(m[k]!==undefined&&m[k]!=='')o[k]=m[k]});return o};
const obRow=(c,m)=>({id:m.id,conv_id:c.id,sender:myId,kind:m.k,body:(m.text||'').slice(0,12000),dur:m.dur==null?null:m.dur,meta:obMeta(m)});
function obSendMsg(c,m,files){
  const it={id:m.id,conv:c.id,files:files.map(f=>({bucket:f.bucket,path:f.path,blob:f.blob,mime:f.mime,done:false})),row:obRow(c,m),created:Date.now()};
  let mm=null;
  obPut(it);
  const pre=obUpload(it,()=>{if(mm&&!mm.pending){mm.pending=true;if(view==='chat'&&cur===c.id)renderMsgs()}});
  mm=addMsg(c,m,pre);
  return mm;
}
/* vocal : remplace l'ancien envoi, qui perdait l'audio sans réseau */
function sendVoiceTo(c,r){
  const id=uuid(),m={id:id,f:'me',k:'voice',text:r.text||'Vocal (transcription indisponible)',dur:r.dur,re:(cur===c.id?replyTo:null)||undefined};
  if(r.blob){
    const path=c.id+'/'+id+'.'+extOf(r.mime);
    m.audio=path;m.localAudio=URL.createObjectURL(r.blob);
    obSendMsg(c,m,[{bucket:'voices',path:path,blob:r.blob,mime:r.mime||'audio/webm'}]);
  }else addMsg(c,m);
  if(cur===c.id){replyTo=null;renderComposer();renderReplyBar();renderMsgs(true)}
  mascotFly('send');
}

/* reprise au démarrage : ce qui n'est pas parti est renvoyé */
async function obResume(){
  const all=await obAll();
  for(const it of all){
    if(it.id==='rec-current'||OB.live[it.id]||!it.row||!it.files)continue;
    if(Date.now()-it.created>7*864e5){obDel(it.id);continue}
    try{
      await obUpload(it,null);
      const r=await sb.from('messages').insert(it.row);
      if(!r.error||r.error.code==='23505'){await obDel(it.id);toast('Un message en attente a été envoyé ✔')}
    }catch(e){}
  }
}

/* messages en échec : réessayer / supprimer */
const obFindMsg=id=>{for(const c of convs){const m=c.msgs.find(x=>x.id===id);if(m)return {c:c,m:m}}return null};
A.mretry=t=>{
  const f=obFindMsg(t.dataset.id);if(!f||!f.m._row)return;
  const m=f.m;m.failed=null;m.pending=true;if(view==='chat')renderMsgs();
  sb.from('messages').insert(m._row).then(r=>{
    if(!r.error||r.error.code==='23505'){delete m.pending;obDel(m.id);if(view==='chat')renderMsgs();return}
    m.pending=false;m.failed=r.error.message;if(view==='chat')renderMsgs();
  });
};
A.mdrop=t=>{
  const f=obFindMsg(t.dataset.id);if(!f)return;
  f.c.msgs=f.c.msgs.filter(x=>x!==f.m);obDel(f.m.id);
  OUTQ=OUTQ.filter(o=>!(o.row&&o.row.id===f.m.id));outqSave();
  if(view==='chat')renderMsgs();else if(view==='chats')renderChats();
};

A.obretry=()=>{
